name: release-server

# Un tag `server-vX.Y.Z` publica la release del server (ADR-0018). El tag ES la versión
# declarada: el preflight falla si `Cargo.toml` no coincide, y los gates son los mismos que
# se corren a mano, no una lista paralela que se desactualiza.
on:
  push:
    tags: ['server-v*']
  # Permite re-verificar el pipeline (o re-publicar) sin taggear de nuevo.
  workflow_dispatch:

permissions:
  contents: write # crear la GitHub Release
  packages: write # publicar la imagen en GHCR

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/preflight-release.sh "$GITHUB_REF_NAME"
          # Las notas de la release salen del CHANGELOG, no de un resumen automático.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1 }
            dentro && /^## \[/ && $0 !~ "^## \\[" v "\\]" { exit }
            dentro { print }
          ' CHANGELOG.md > notas-release.md
          if [ ! -s notas-release.md ]; then
            echo "✗ el CHANGELOG no tiene una sección para $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notas-release
          path: notas-release.md

  gates:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Suites TypeScript
        run: |
          npm ci
          npm run build
          npm test
      - name: Specs de browser (durabilidad contra un Chromium real)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Suites Rust
        run: cargo test --workspace
      - name: Smoke del server (cripto viva y WebSocket)
        run: bash tests/scripts/server-smoke.sh
      - name: Canaria de cifrado (nada en claro en el almacén)
        run: bash tests/scripts/scan-canary.sh

  binario:
    needs: [preflight, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Compilar (estático)
        run: cargo build --release --target x86_64-unknown-linux-musl -p ovaultd-server
      - name: Empaquetar con checksum
        run: |
          cantidad="${{ needs.preflight.outputs.version }}"
          base="ovaultd-$cantidad-x86_64-unknown-linux-musl"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ovaultd dist/
          cp target/x86_64-unknown-linux-musl/release/ovaultd-admin dist/
          tar -C dist -czf "dist/$base.tar.gz" ovaultd ovaultd-admin
          (cd dist && sha256sum "$base.tar.gz" > SHA256SUMS)
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binario
          path: dist/*

  imagen:
    needs: [preflight, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # El E2E del contenedor no es solo docker: el paso de sync real corre el runtime en
      # Chromium contra el server del contenedor, así que hacen falta las dependencias del
      # repo y el browser. Sin esto, `npx playwright` se baja cualquier versión y revienta
      # con ERR_MODULE_NOT_FOUND.
      - name: Dependencias del cliente (el E2E usa Chromium de verdad)
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      # Construye la imagen del compose, la levanta, corre el smoke completo (HTTP +
      # WebSocket, cripto viva) + el sync real en Chromium, y verifica que la base
      # sobreviva a un recreate.
      # El driver por defecto de compose (`docker`) no soporta cache_from/cache_to de GHA: esta
      # action deja un builder docker-container como default, que es el que entiende `type=gha`.
      - uses: docker/setup-buildx-action@v3
      - name: E2E del contenedor (flujo completo + persistencia)
        env:
          # Activa el overlay docker/compose.ci.yaml (caché de layers). Comparte la clave con el
          # build del job `gates`, así no se compilan dos veces las mismas dependencias.
          OVAULTD_CI_CACHE: "1"
        run: bash tests/scripts/container-e2e.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR la imagen que PASÓ el E2E
        run: |
          vers="${{ needs.preflight.outputs.version }}"
          # No se construye una imagen nueva para publicar: se re-taggea exactamente la que
          # el E2E levantó y verificó. Lo que se publica es lo que se probó.
          docker tag ovaultd:dev "ghcr.io/${{ github.repository }}:$vers"
          docker tag ovaultd:dev "ghcr.io/${{ github.repository }}:latest"
          docker push "ghcr.io/${{ github.repository }}:$vers"
          docker push "ghcr.io/${{ github.repository }}:latest"
          docker image inspect "ghcr.io/${{ github.repository }}:$vers" --format 'imagen publicada: {{.Id}} ({{.Size}} bytes)'

  release:
    needs: [preflight, binario, imagen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publicar la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vers="${{ needs.preflight.outputs.version }}"
          gh release create "server-v$vers" \
            --repo "${{ github.repository }}" \
            --title "ovaultd server v$vers" \
            --notes-file assets/notas-release/notas-release.md \
            --verify-tag \
            assets/binario/ovaultd-$vers-x86_64-unknown-linux-musl.tar.gz \
            assets/binario/SHA256SUMS
          echo "── release publicada ──"
          gh release view "server-v$vers" --repo "${{ github.repository }}"
