name: release-server

# Un tag `server-vX.Y.Z` publica la release del server (ADR-0018). El tag ES la versión
# declarada: el preflight falla si `Cargo.toml` no coincide, y los gates son los mismos que
# se corren a mano, no una lista paralela que se desactualiza.
on:
  push:
    tags: ['server-v*']

permissions:
  contents: write # crear la GitHub Release
  packages: write # publicar la imagen en GHCR

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/preflight-release.sh "$GITHUB_REF_NAME"
          # Las notas de la release salen del CHANGELOG, no de un resumen automático.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1 }
            dentro && /^## \[/ && $0 !~ "^## \\[" v "\\]" { exit }
            dentro { print }
          ' CHANGELOG.md > notas-release.md
          if [ ! -s notas-release.md ]; then
            echo "✗ el CHANGELOG no tiene una sección para $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notas-release
          path: notas-release.md

  gates:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Suites TypeScript
        run: |
          npm ci
          npm run build
          npm test
      - name: Specs de browser (durabilidad contra un Chromium real)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Suites Rust
        run: cargo test --workspace
      - name: Smoke del server (cripto viva y WebSocket)
        run: bash tests/scripts/server-smoke.sh
      - name: Canaria de cifrado (nada en claro en el almacén)
        run: bash tests/scripts/scan-canary.sh

  binario:
    needs: [preflight, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Compilar (estático)
        run: cargo build --release --target x86_64-unknown-linux-musl -p ovaultd-server
      - name: Empaquetar con checksum
        run: |
          cantidad="${{ needs.preflight.outputs.version }}"
          base="ovaultd-$cantidad-x86_64-unknown-linux-musl"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ovaultd dist/
          cp target/x86_64-unknown-linux-musl/release/ovaultd-admin dist/
          tar -C dist -czf "dist/$base.tar.gz" ovaultd ovaultd-admin
          (cd dist && sha256sum "$base.tar.gz" > SHA256SUMS)
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binario
          path: dist/*

  imagen:
    needs: [preflight, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de release
        run: |
          docker build -f docker/Dockerfile \
            -t "ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}" \
            -t "ghcr.io/${{ github.repository }}:latest" .
      # El E2E del contenedor construye la imagen real, la levanta detrás de un proxy y
      # verifica el flujo completo + la persistencia tras un recreate. Es el gate que
      # justifica publicar: se corre contra lo que se va a publicar, no contra otra cosa.
      - name: E2E del contenedor (flujo completo + persistencia)
        run: bash tests/scripts/container-e2e.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}"
          docker push "ghcr.io/${{ github.repository }}:latest"

  release:
    needs: [preflight, binario, imagen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publicar la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vers="${{ needs.preflight.outputs.version }}"
          gh release create "server-v$vers" \
            --repo "${{ github.repository }}" \
            --title "ovaultd server v$vers" \
            --notes-file assets/notas-release/notas-release.md \
            --verify-tag \
            assets/binario/ovaultd-$vers-x86_64-unknown-linux-musl.tar.gz \
            assets/binario/SHA256SUMS
          echo "── release publicada ──"
          gh release view "server-v$vers" --repo "${{ github.repository }}"
