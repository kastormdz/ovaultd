{% extends "admin/base.html" %}
{% block titulo %}{{ t.ajustes_titulo }} — {{ t.marca }}{% endblock %}
{% block contenido %}

<div class="cabecera-seccion">
  <h1>{{ t.ajustes_titulo }}</h1>
</div>

{% if let Some(texto) = ok %}<div class="alerta bien">{{ texto }}</div>{% endif %}

<section class="tarjeta">
  <h2>{{ t.ajustes_registro_titulo }}</h2>
  <form method="post" action="/admin/ajustes" class="formulario">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="check">
      <input type="checkbox" name="registro" value="on" {% if registro_abierto %}checked{% endif %}>
      {{ t.ajustes_registro_check }}
    </label>
    <p class="ayuda">{{ t.ajustes_registro_ayuda }}</p>
    <button class="boton primario" type="submit">{{ t.btn_guardar }}</button>
  </form>
</section>
{% endblock %}
