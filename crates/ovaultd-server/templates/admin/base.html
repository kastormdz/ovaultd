<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ovaultd{% endblock %}</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/admin/assets/htmx.min.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="marca" href="/admin"><span class="punto"></span> ovaultd <span class="ver">v{{ version }}</span></a>
    {% block nav %}{% endblock %}
  </header>
  <main class="contenedor">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">ovaultd — self-hosted · cifrado de punta a punta · el server nunca ve tu contenido</footer>
</body>
</html>
