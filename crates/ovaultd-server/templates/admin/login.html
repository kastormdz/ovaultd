{% extends "admin/base_centrado.html" %}
{% block titulo %}{{ t.login_titulo }} — {{ t.marca }}{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1 class="titulo-form">{{ t.login_titulo }}</h1>
  {% if let Some(texto) = error %}<div class="alerta error">{{ texto }}</div>{% endif %}
  <form method="post" action="/admin/login" class="formulario">
    <label>{{ t.login_email }}
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>{{ t.login_password }}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="boton primario" type="submit">{{ t.login_entrar }}</button>
  </form>
</section>
{% endblock %}
