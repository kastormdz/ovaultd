[package]
name = "ovaultd-server"
version = "0.2.3"
edition = "2024"

[[bin]]
name = "ovaultd"
path = "src/main.rs"

[[bin]]
name = "ovaultd-admin"
path = "src/bin/ovaultd-admin.rs"

[dependencies]
argon2 = "0.6.0"
askama = "0.14"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
ovaultd-crypto = { version = "0.2.0", path = "../ovaultd-crypto" }
ovaultd-protocol = { version = "0.2.0", path = "../ovaultd-protocol" }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }
futures = "0.3.34"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
futures = "0.3.34"
tower = { version = "0.5.3", features = ["util"] }
