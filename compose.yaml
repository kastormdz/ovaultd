# ovaultd — stack base (fase 1).
#
# Pensado para vivir DETRÁS de un borde reverso: publica en loopback por defecto
# (OVAULTD_ADDR) y el borde habla con ese puerto. Guía (NPM Plus, nginx, Caddy):
# `docs/deploy.md` — el repositorio no trae proxy (ADR-0019).
#
# Desarrollo (construye la imagen local):
#   cp .env.example .env && chmod 600 .env
#   docker compose -f compose.yaml -f docker/compose.dev.yaml up -d --build
#   curl --fail http://127.0.0.1:8080/healthz
#
# Distribución: OVAULTD_IMAGE=repositorio@sha256:<digest REAL de una imagen publicada>
# (nunca un digest inventado) y este archivo solo.

name: ovaultd

services:
  ovaultd:
    image: ${OVAULTD_IMAGE:-ovaultd:local}
    restart: unless-stopped
    ports:
      # 127.0.0.1 => solo el proxy local. Para un proxy en OTRA máquina: OVAULTD_ADDR=0.0.0.0
      # (y firewall: el server NO trae TLS, el TLS lo termina el proxy).
      - "${OVAULTD_ADDR:-127.0.0.1}:${OVAULTD_PORT:-8080}:8080"
    environment:
      # Dentro del contenedor escucha en todas las interfaces; el puerto del host decide quién entra.
      OVAULTD_BIND: "0.0.0.0:8080"
      OVAULTD_DB: /data/metadata.db
      OVAULTD_CAS: /data/cas
      OVAULTD_TOKEN_TTL_HOURS: "${OVAULTD_TOKEN_TTL_HOURS:-720}"
      OVAULTD_CHALLENGE_TTL: "${OVAULTD_CHALLENGE_TTL:-300}"
      OVAULTD_UPLOAD_TTL_HOURS: "${OVAULTD_UPLOAD_TTL_HOURS:-24}"
      # Vacío = bootstrap /setup abierto mientras no haya cuentas (ver docs/deploy.md, ADR-0016).
      OVAULTD_SETUP_TOKEN: "${OVAULTD_SETUP_TOKEN:-}"
      OVAULTD_LOG_JSON: "${OVAULTD_LOG_JSON:-1}"
      # 1 = hay un borde de confianza adelante: se obedecen X-Real-IP / X-Forwarded-For /
      # X-Forwarded-Proto (docs/deploy.md). Default 0: los headers de cualquiera NO cuentan
      # (la IP sale del peer TCP y el esquema no habilita el Secure de la cookie).
      OVAULTD_TRUST_PROXY: "${OVAULTD_TRUST_PROXY:-0}"
    volumes:
      # Default: volumen nombrado. Para un bind mount (backups con rsync, NFS, etc.):
      # OVAULTD_DATA=/ruta/absoluta/en/el/host
      - "${OVAULTD_DATA:-datos}:/data"
    read_only: true
    tmpfs:
      - /tmp
    # El contenedor corre como 10001 (no root). Con volumen nombrado no hace falta nada; con
    # BIND MOUNT el directorio lo crea el operador y pertenece a otro uid: SQLite falla al
    # abrirlo ("unable to open database file", code 14). En ese caso poné OVAULTD_UID/GID al
    # dueño real del directorio (por ejemplo el usuario que corre el stack).
    user: "${OVAULTD_UID:-10001}:${OVAULTD_GID:-10001}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OVAULTD_MEM_LIMIT:-512m}
    cpus: ${OVAULTD_CPUS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  datos:
    name: ovaultd-datos
