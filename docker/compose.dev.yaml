# Overlay de DESARROLLO: construye la imagen local.
#
#   docker compose -f compose.yaml -f docker/compose.dev.yaml up -d --build
#   curl --fail http://127.0.0.1:8080/healthz      # directo al server
#
# No trae proxy: el borde (TLS, WS, subidas grandes) es del operador (ADR-0019) —
# en producción lo pone NPM Plus / nginx / Caddy, y `docs/deploy.md` documenta los tres
# puntos que cualquier borde tiene que respetar.
#
# Los paths relativos se resuelven contra el PROJECT DIR (la carpeta de compose.yaml, o sea
# la raíz del repo): invocá siempre desde acá, con compose.yaml primero.
services:
  ovaultd:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ovaultd:dev
